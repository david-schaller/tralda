name: Deploy docs

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Determine site URL
        id: target
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "site_url=https://david-schaller.github.io/tralda/" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://david-schaller.github.io/tralda/dev/" >> "$GITHUB_OUTPUT"
          fi
      - run: uv sync --group docs
      - run: uv run mkdocs build
        env:
          MKDOCS_SITE_URL: ${{ steps.target.outputs.site_url }}
      - name: Push to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir pages-branch && cd pages-branch
          git init -b gh-pages .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin gh-pages 2>/dev/null && git reset --hard FETCH_HEAD || true
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            rsync -a --delete --exclude=.git --exclude=dev ../site/ .
          else
            rm -rf dev
            cp -r ../site/ dev
          fi
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Deploy tralda docs (${{ github.ref_name }})"
          git push --force origin HEAD:gh-pages
